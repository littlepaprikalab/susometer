<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Final leaderboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&amp;family=Work+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A160C}a:hover{color:#5A3420}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 18px 28px; background: #F2B33D; color: #2A160C; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <h1 style="margin: 0; font-family: 'Bowlby One SC', sans-serif; font-weight: 400; font-size: 34px; line-height: 1.05">And the winners are…</h1>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 4px 0 #2A160C">
      <span style="font-size: 13px; font-weight: 700">Best poker face</span>
      <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 26px">Priya</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700"><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F78"></span>avg 18</span>
    </div>
    <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 4px 0 #2A160C">
      <span style="font-size: 13px; font-weight: 700">Most sus</span>
      <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 26px">Sam</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700"><span style="width: 10px; height: 10px; border-radius: 5px; background: #D9412B"></span>avg 71</span>
    </div>
  </div>

  <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 18px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 0 #2A160C">
    <div style="width: 44px; height: 44px; border-radius: 22px; background: #2A160C; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2B33D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21M8 10.5l2 2 3.5-4"></path></svg>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 13px; font-weight: 700">Best lie detector</span>
      <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 22px; line-height: 1.1">Jordan</span>
    </div>
    <span style="font-size: 14px; font-weight: 700; text-align: right; line-height: 1.25">Matched the<br>meter 9 of 11</span>
  </div>

  <div style="background: #D9412B; border: 3px solid #2A160C; border-radius: 22px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 0 #2A160C">
    <div style="display: flex; justify-content: space-between; width: 100%" aria-hidden="true">
      <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="12">
        <span style="width: 11px; height: 11px; border-radius: 6px; background: #FFE9A8; border: 2px solid #2A160C"></span>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 58px; line-height: 1; color: #FFF4DF">94</span>
      <div style="flex-grow: 1; background: #FFF4DF; border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em">BIGGEST SPIKE · ALEX</span>
        <span style="font-size: 15px; font-weight: 700">“Do you actually like your boss?”</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 7px">
    <sc-for list="{{ranks}}" as="r" hint-placeholder-count="4">
      <div style="background: #FFF4DF; border: 2.5px solid #2A160C; border-radius: 14px; padding: 8px 12px; display: flex; align-items: center; gap: 10px">
        <span style="width: 18px; font-family: 'Bowlby One SC', sans-serif; font-size: 16px">{{r.pos}}</span>
        <span style="width: 62px; font-size: 15px; font-weight: 700">{{r.name}}</span>
        <div style="flex-grow: 1; height: 14px; border-radius: 4px; border: 2px solid #2A160C; background: #E8D9BC; overflow: hidden">
          <div style="height: 14px; background: {{r.color}}; width: {{r.width}}"></div>
        </div>
        <span style="width: 30px; text-align: right; font-family: 'Bowlby One SC', sans-serif; font-size: 16px">{{r.score}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <a href="Main.dc.html" style="height: 58px; border-radius: 16px; border: 3px solid #2A160C; background: #1F6F78; color: #FFF4DF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Bowlby One SC', sans-serif; font-size: 21px; box-shadow: 0 5px 0 #2A160C">Play again</a>
    <div style="display: flex; gap: 10px">
      <a href="Replay.dc.html" style="flex: 1; height: 48px; border-radius: 16px; border: 3px solid #2A160C; background: #FFF4DF; color: #2A160C; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; box-shadow: 0 4px 0 #2A160C">Watch the replay</a>
      <button style="flex: 1; height: 48px; border-radius: 16px; border: 3px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 700; box-shadow: 0 4px 0 #2A160C; cursor: pointer">Share results</button>
    </div>
    <p style="margin: 0; text-align: center; font-size: 13px; font-weight: 600">Scores are wiped when you leave this screen.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [['Sam', 71], ['Alex', 58], ['Jordan', 33], ['Priya', 18]];
    var bulbs = [];
    for (var j = 0; j < 12; j++) { bulbs.push({ id: j }); }
    return {
      bulbs: bulbs,
      ranks: rows.map(function (r, i) {
        return {
          pos: String(i + 1),
          name: r[0],
          score: String(r[1]),
          width: r[1] + '%',
          color: r[1] >= 60 ? '#D9412B' : (r[1] < 35 ? '#1F6F78' : '#E7C64A')
        };
      })
    };
  }
}
</script>
</body>
</html>
