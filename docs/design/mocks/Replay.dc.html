<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game replay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&amp;family=Work+Sans:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A160C}a:hover{color:#5A3420}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 18px 28px; background: #F2B33D; color: #2A160C; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Leaderboard.dc.html" aria-label="Back to scores" style="width: 44px; height: 44px; border-radius: 22px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; display: flex; align-items: center; justify-content: center; box-sizing: border-box; box-shadow: 0 3px 0 #2A160C"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Bowlby One SC', sans-serif; font-weight: 400; font-size: 32px">The replay</h1>
  </div>

  <div style="display: flex; gap: 6px">
    <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 2.5px solid #2A160C; background: #2A160C; color: #F2B33D; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Sam</button>
    <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Alex</button>
    <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Priya</button>
    <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Jordan</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <div style="background: #FFF4DF; border: 2.5px solid #2A160C; border-radius: 16px; padding: 10px 12px; display: flex; gap: 12px; align-items: center">
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 15px; font-weight: 700; line-height: 1.25">{{it.q}}</span>
          <span style="font-size: 14px; font-style: italic; font-weight: 500">“{{it.a}}”</span>
          <svg width="200" height="22" viewBox="0 0 200 22" fill="none" aria-hidden="true"><polyline points="{{it.spark}}" stroke="#2A160C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>
        </div>
        <div style="width: 60px; height: 64px; border-radius: 14px; border: 2.5px solid #2A160C; background: {{it.color}}; color: #FFF4DF; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0">
          <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 24px; line-height: 1">{{it.score}}</span>
          <span style="font-size: 12px; font-weight: 700">{{it.label}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <p style="margin: 0; text-align: center; font-size: 13px; font-weight: 600">Transcripts live in memory only. Gone when you wipe or close the app.</p>
    <div style="display: flex; gap: 10px">
      <button style="flex: 1; height: 56px; border-radius: 16px; border: 3px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 5px 0 #2A160C; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h12M7 5V3h4v2M5 5l1 10h6l1-10"></path></svg>Wipe everything</button>
      <a href="Main.dc.html" style="flex: 1; height: 56px; border-radius: 16px; border: 3px solid #2A160C; background: #1F6F78; color: #FFF4DF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Bowlby One SC', sans-serif; font-size: 19px; box-shadow: 0 5px 0 #2A160C">Play again</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      { q: 'Do you floss every single day?', a: 'Yes. Every day. Basically.', score: 48, spark: '0,14 25,13 50,14 75,10 100,8 125,11 150,12 175,13 200,14' },
      { q: 'Have you ever re-gifted a present?', a: 'No way. Okay… maybe once.', score: 82, spark: '0,15 25,14 50,15 65,6 80,3 100,5 125,8 150,11 175,13 200,14' },
      { q: 'Pineapple on pizza: yes or no?', a: 'Honestly? Yes.', score: 22, spark: '0,14 25,14 50,13 75,13 100,12 125,13 150,14 175,14 200,14' },
      { q: 'Have you ever read someone’s texts?', a: 'Never.', score: 91, spark: '0,16 20,15 40,4 55,2 70,3 90,5 115,7 140,9 170,12 200,13' }
    ];
    return {
      items: rows.map(function (r) {
        return {
          q: r.q, a: r.a, spark: r.spark, score: String(r.score),
          label: r.score >= 60 ? 'Sus!' : (r.score < 35 ? 'Legit' : 'Hmm'),
          color: r.score >= 60 ? '#D9412B' : (r.score < 35 ? '#1F6F78' : '#8A4B1C')
        };
      })
    };
  }
}
</script>
</body>
</html>
