<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calibrating baseline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&amp;family=Work+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A160C}a:hover{color:#5A3420}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 18px 28px; background: #F2B33D; color: #2A160C; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Bowlby One SC', sans-serif; font-weight: 400; font-size: 26px">Warming up Sam</h1>
    <span style="background: #2A160C; color: #F2B33D; border-radius: 20px; padding: 6px 14px; font-family: 'Bowlby One SC', sans-serif; font-size: 16px">0:38</span>
  </div>

  <div style="display: flex; gap: 10px" role="img" aria-label="Step 1, sit still, done. Step 2, chat a bit, 2 of 6">
    <div style="flex: 4; display: flex; flex-direction: column; gap: 5px">
      <div style="display: flex; gap: 4px">
        <sc-for list="{{still}}" as="k" hint-placeholder-count="4">
          <span style="flex: 1; height: 18px; border-radius: 5px; border: 2.5px solid #2A160C; background: {{k.color}}"></span>
        </sc-for>
      </div>
      <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#1F6F78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7"></path></svg>1 · Sit still</span>
    </div>
    <div style="flex: 6; display: flex; flex-direction: column; gap: 5px">
      <div style="display: flex; gap: 4px">
        <sc-for list="{{chat}}" as="k" hint-placeholder-count="6">
          <span style="flex: 1; height: 18px; border-radius: 5px; border: 2.5px solid #2A160C; background: {{k.color}}"></span>
        </sc-for>
      </div>
      <span style="font-size: 13px; font-weight: 700">2 · Chat a bit</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 13px; font-weight: 700">Warm-up 1 of 3 · from the easy deck</span>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 48px; height: 48px; border-radius: 24px; background: #2A160C; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2B33D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
      </div>
      <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 18px 18px 18px 4px; padding: 10px 14px">
        <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 20px; line-height: 1.2">What did you have for breakfast?</span>
      </div>
    </div>
  </div>

  <div style="position: relative; height: 260px; border-radius: 24px; border: 3px solid #2A160C; background: #2A160C; overflow: hidden; display: flex; align-items: center; justify-content: center">
    <svg width="160" height="210" viewBox="0 0 190 250" fill="none" role="img" aria-label="Face guide: keep your face inside the oval"><ellipse cx="95" cy="125" rx="88" ry="118" stroke="#FFE9A8" stroke-width="4" stroke-dasharray="12 10"></ellipse></svg>
    <div style="position: absolute; top: 12px; left: 12px; display: flex; gap: 6px">
      <span style="display: flex; align-items: center; gap: 6px; background: #FFF4DF; border-radius: 14px; padding: 5px 10px; font-size: 12px; font-weight: 700"><span style="width: 9px; height: 9px; border-radius: 5px; background: #1F6F78"></span>Face found</span>
      <span style="display: flex; align-items: center; gap: 6px; background: #FFF4DF; border-radius: 14px; padding: 5px 10px; font-size: 12px; font-weight: 700"><span style="width: 9px; height: 9px; border-radius: 5px; background: #1F6F78"></span>Light good</span>
    </div>
    <span style="position: absolute; bottom: 12px; left: 12px; display: flex; align-items: center; gap: 6px; background: #FFF4DF; border-radius: 14px; padding: 5px 10px; font-size: 12px; font-weight: 700">
      <span style="display: flex; align-items: center; gap: 2px; height: 14px" aria-hidden="true">
        <sc-for list="{{levels}}" as="l" hint-placeholder-count="5">
          <span style="width: 3px; border-radius: 2px; background: #1F6F78; height: {{l.h}}"></span>
        </sc-for>
      </span>
      Sam is talking
    </span>
  </div>

  <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
    <div style="display: flex; flex-direction: column; min-width: 68px">
      <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 38px; line-height: 1; color: #D9412B">72</span>
      <span style="font-size: 12px; font-weight: 700">BPM · live</span>
    </div>
    <svg width="236" height="44" viewBox="0 0 300 44" preserveAspectRatio="none" fill="none" role="img" aria-label="Live pulse waveform"><polyline points="0,30 12,6 22,36 32,24 44,32 75,30 87,6 97,36 107,24 119,32 150,30 162,6 172,36 182,24 194,32 225,30 237,6 247,36 257,24 269,32 300,30" stroke="#D9412B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button style="height: 52px; border-radius: 16px; border: 3px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 #2A160C; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l6 5-6 5M11 4v10"></path></svg>Doesn't apply? Next one</button>
    <a href="Question.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; font-weight: 600; text-decoration: none">The show starts by itself once your normal is locked in.</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var still = [], chat = [];
    for (var i = 0; i < 4; i++) { still.push({ color: '#1F6F78' }); }
    for (var j = 0; j < 6; j++) { chat.push({ color: j < 2 ? '#1F6F78' : '#FFF4DF' }); }
    var hs = [6, 12, 9, 14, 7];
    return { still: still, chat: chat, levels: hs.map(function (h) { return { h: h + 'px' }; }) };
  }
}
</script>
</body>
</html>
