<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Style B: 70s game show verdict</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&amp;family=Work+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A160C}a:hover{color:#5A3420}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 18px 28px; background: #F2B33D; color: #2A160C; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 18px">Round 2</span>
    <span style="background: #2A160C; color: #F2B33D; border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: 14px">Sam's in the hot seat</span>
  </div>

  <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 18px; padding: 12px 16px">
    <p style="margin: 0; font-size: 19px; font-weight: 700; line-height: 1.3">“Have you ever re-gifted a present?”</p>
  </div>

  <div style="background: #D9412B; border: 3px solid #2A160C; border-radius: 26px; padding: 14px 14px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 6px 0 #2A160C">
    <div style="display: flex; justify-content: space-between; width: 100%" aria-hidden="true">
      <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="12">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #FFE9A8; border: 2px solid #2A160C"></span>
      </sc-for>
    </div>
    <span style="margin-top: 8px; background: #FFF4DF; color: #2A160C; border-radius: 12px; padding: 4px 12px; font-weight: 700; font-size: 13px; letter-spacing: 0.08em">THE SUS-O-METER SAYS</span>
    <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 104px; line-height: 1; color: #FFF4DF">82</span>
    <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 40px; line-height: 1; color: #FFF4DF">Sus!</span>
    <div style="display: flex; justify-content: space-between; width: 100%; margin-top: 10px" aria-hidden="true">
      <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="12">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #FFE9A8; border: 2px solid #2A160C"></span>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; gap: 5px" role="img" aria-label="Applause meter: 8 of 10 lit">
      <sc-for list="{{blocks}}" as="k" hint-placeholder-count="10">
        <span style="flex: 1; height: 34px; border-radius: 6px; border: 2.5px solid #2A160C; background: {{k.color}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 13px">
      <span>Cool as ice</span>
      <span>Caught red-handed</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="background: #FFF4DF; border: 2.5px solid #2A160C; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 22px">+16</span>
      <span style="font-size: 12px; font-weight: 600">pulse</span>
    </div>
    <div style="background: #FFF4DF; border: 2.5px solid #2A160C; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 22px">+41%</span>
      <span style="font-size: 12px; font-weight: 600">blinks</span>
    </div>
    <div style="background: #FFF4DF; border: 2.5px solid #2A160C; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 22px">2.1s</span>
      <span style="font-size: 12px; font-weight: 600">pause</span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; gap: 10px">
    <button style="flex: 1; height: 58px; border-radius: 16px; border: 3px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 700; box-shadow: 0 5px 0 #2A160C; cursor: pointer">End turn</button>
    <button style="flex: 2; height: 58px; border-radius: 16px; border: 3px solid #2A160C; background: #1F6F78; color: #FFF4DF; font-family: 'Bowlby One SC', sans-serif; font-size: 19px; box-shadow: 0 5px 0 #2A160C; cursor: pointer">Next question</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var lit = ['#1F6F78', '#1F6F78', '#3E8C7A', '#8FAE5B', '#E7C64A', '#FFE9A8', '#F08A4B', '#D9412B'];
    var blocks = [];
    for (var i = 0; i < 10; i++) {
      blocks.push({ color: i < lit.length ? lit[i] : '#E8D9BC' });
    }
    var bulbs = [];
    for (var j = 0; j < 12; j++) { bulbs.push({ id: j }); }
    return { blocks: blocks, bulbs: bulbs };
  }
}
</script>
</body>
</html>
