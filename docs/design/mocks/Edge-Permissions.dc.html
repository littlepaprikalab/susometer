<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Permissions needed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&amp;family=Work+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A160C}a:hover{color:#5A3420}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 18px 28px; background: #F2B33D; color: #2A160C; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
  <div style="width: 88px; height: 88px; border-radius: 44px; background: #2A160C; display: flex; align-items: center; justify-content: center; margin-top: 12px">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="#F2B33D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14h7l3-4h12l3 4h7v20H6z"></path><circle cx="22" cy="23" r="6"></circle><path d="M5 5l34 34"></path></svg>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Bowlby One SC', sans-serif; font-weight: 400; font-size: 32px; line-height: 1.05">The show needs eyes and ears</h1>
    <p style="margin: 0; font-size: 15px; font-weight: 500; line-height: 1.45">Turn these on in Settings. Video and audio never leave this phone.</p>
  </div>

  <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 20px; padding: 6px 14px; display: flex; flex-direction: column">
    <sc-for list="{{perms}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: {{p.rule}}">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">{{p.name}} <span style="font-size: 12px; font-weight: 600">· {{p.need}}</span></span>
          <span style="font-size: 13px; font-weight: 500">{{p.why}}</span>
        </div>
        <span style="display: flex; align-items: center; gap: 6px; border: 2px solid #2A160C; border-radius: 12px; padding: 3px 9px; font-size: 13px; font-weight: 700; flex-shrink: 0"><span style="width: 9px; height: 9px; border-radius: 5px; background: {{p.dot}}"></span>{{p.state}}</span>
      </div>
    </sc-for>
  </div>

  <p style="margin: 0; font-size: 14px; font-weight: 600; line-height: 1.4">No mic? You can still play. The host types nothing, and you tap to move between question and answer.</p>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button style="height: 60px; border-radius: 16px; border: 3px solid #2A160C; background: #1F6F78; color: #FFF4DF; font-family: 'Bowlby One SC', sans-serif; font-size: 21px; box-shadow: 0 5px 0 #2A160C; cursor: pointer">Open Settings</button>
    <button style="height: 48px; border-radius: 16px; border: 3px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 700; box-shadow: 0 4px 0 #2A160C; cursor: pointer">Play without voice</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      { name: 'Camera', need: 'required', why: 'Reads pulse, blinks and expressions', on: false },
      { name: 'Microphone', need: 'optional', why: 'Hears the question and the answer', on: false },
      { name: 'Speech recognition', need: 'optional', why: 'Turns speech into text, on this phone', on: true }
    ];
    return {
      perms: rows.map(function (r, i) {
        return {
          name: r.name, need: r.need, why: r.why,
          state: r.on ? 'On' : 'Off',
          dot: r.on ? '#1F6F78' : '#D9412B',
          rule: i < rows.length - 1 ? '1.5px solid #2A160C' : 'none'
        };
      })
    };
  }
}
</script>
</body>
</html>
