<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hot-seat consent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&amp;family=Work+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A160C}a:hover{color:#5A3420}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 18px 28px; background: #F2B33D; color: #2A160C; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Back to lobby" style="width: 44px; height: 44px; border-radius: 22px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; display: flex; align-items: center; justify-content: center; box-sizing: border-box; box-shadow: 0 3px 0 #2A160C"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5"></path></svg></a>
    <span style="background: #2A160C; color: #F2B33D; border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: 14px">Contestant 1 of 4</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 17px; font-weight: 700">Pass the phone to</span>
    <h1 style="margin: 0; font-family: 'Bowlby One SC', sans-serif; font-weight: 400; font-size: 76px; line-height: 1">Sam</h1>
    <p style="margin: 0; font-size: 15px; font-weight: 600">Only Sam can say yes. Everyone else, hands off.</p>
  </div>

  <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 17px">Your front camera reads</span>
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#D9412B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 11h4l2-5 3 10 2-5h7"></path></svg>
      <span style="font-size: 16px; font-weight: 600">Pulse and heart-rate changes</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#D9412B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 11s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"></path><circle cx="11" cy="11" r="2.5"></circle></svg>
      <span style="font-size: 16px; font-weight: 600">Blinks and facial expressions</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#D9412B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v8a3 3 0 0 0 6 0V3"></path><path d="M5 10a6 6 0 0 0 12 0M11 16v3"></path></svg>
      <span style="font-size: 16px; font-weight: 600">When you start talking</span>
    </div>
  </div>

  <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 17px">What happens to it</span>
    <sc-for list="{{promises}}" as="pr" hint-placeholder-count="4">
      <div style="display: flex; align-items: flex-start; gap: 10px">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#1F6F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex-shrink: 0"><path d="M3.5 9.5l3.5 3.5 7.5-8"></path></svg>
        <span style="font-size: 15px; font-weight: 500; line-height: 1.4">{{pr.text}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="Calibrate.dc.html" style="height: 60px; border-radius: 16px; border: 3px solid #2A160C; background: #1F6F78; color: #FFF4DF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Bowlby One SC', sans-serif; font-size: 21px; box-shadow: 0 5px 0 #2A160C">I agree, measure me</a>
    <a href="Main.dc.html" style="height: 48px; border-radius: 16px; border: 3px solid #2A160C; background: #FFF4DF; color: #2A160C; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; box-shadow: 0 4px 0 #2A160C">Skip my turn</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      promises: [
        { text: 'Processed on this phone by the Presage SDK' },
        { text: 'No video is ever saved or sent' },
        { text: 'Scores are wiped when the show ends' },
        { text: 'SDK telemetry is switched off' }
      ]
    };
  }
}
</script>
</body>
</html>
