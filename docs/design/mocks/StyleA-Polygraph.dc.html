<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Style A: polygraph lab report verdict</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;family=IBM+Plex+Serif:ital,wght@1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8321F}a:hover{color:#8E1F12}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 20px 28px; background-color: #F2EDE1; background-image: linear-gradient(#E2DAC6 1px, transparent 1px), linear-gradient(90deg, #E2DAC6 1px, transparent 1px); background-size: 18px 18px; color: #1E1B16; font-family: 'IBM Plex Mono', ui-monospace, monospace; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #1E1B16; padding-bottom: 8px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em">
    <span>EXAM 0412 · SUBJECT: SAM</span>
    <span>Q.02 / 05</span>
  </div>

  <p style="margin: 0; font-family: 'IBM Plex Serif', serif; font-style: italic; font-weight: 500; font-size: 24px; line-height: 1.25">“Have you ever re-gifted a present?”</p>

  <div style="background: #FBF8F1; border: 1.5px solid #1E1B16; padding: 10px 8px 6px">
    <svg width="332" height="200" viewBox="0 0 340 200" fill="none" role="img" aria-label="Chart recorder traces for pulse, blinks and face, spiking after the question">
      <text x="2" y="14" fill="#5E574A" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="500">PULSE</text>
      <text x="2" y="86" fill="#5E574A" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="500">BLINK</text>
      <text x="2" y="146" fill="#5E574A" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="500">FACE</text>
      <line x1="120" y1="0" x2="120" y2="196" stroke="#1E1B16" stroke-width="1" stroke-dasharray="4 4"></line>
      <text x="124" y="196" fill="#1E1B16" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="700">Q ASKED</text>
      <polyline points="0,50 10,44 20,50 30,44 40,50 50,44 60,50 70,44 80,50 90,44 100,50 110,44 120,50 128,30 136,58 144,24 152,60 160,22 168,60 176,20 184,62 192,22 200,60 210,24 220,58 230,26 240,56 250,30 260,54 270,32 280,52 290,36 300,50 310,40 320,50 330,42 340,50" stroke="#C8321F" stroke-width="1.8" stroke-linejoin="round"></polyline>
      <path d="M0 112H340M30 112V96M85 112V96M130 112V92M142 112V94M150 112V90M170 112V92M178 112V94M200 112V92M230 112V96M262 112V94M300 112V96" stroke="#C8321F" stroke-width="1.8"></path>
      <polyline points="0,172 120,172 135,170 150,152 165,150 180,158 200,168 240,172 340,172" stroke="#C8321F" stroke-width="1.8" stroke-linejoin="round"></polyline>
    </svg>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px">
      <span>PULSE ....... <b>+16 BPM</b></span>
      <span>BLINK RATE .. <b>+41%</b></span>
      <span>SURPRISE .... <b>0.42</b></span>
      <span>HESITATION .. <b>2.1 s</b></span>
    </div>
    <div style="transform: rotate(-8deg); border: 4px solid #C8321F; color: #C8321F; padding: 6px 12px; display: flex; flex-direction: column; align-items: center; border-radius: 6px">
      <span style="font-size: 38px; font-weight: 700; line-height: 1; letter-spacing: 0.04em">SUS</span>
      <span style="font-size: 14px; font-weight: 700">82 / 100</span>
    </div>
  </div>

  <div style="border-top: 1px dashed #1E1B16; padding-top: 12px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.06em">EXAMINER'S RULING (THE ROOM)</span>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 46px; border: 1.5px solid #1E1B16; background: #FBF8F1; color: #1E1B16; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; cursor: pointer">[ ] TRUTHFUL</button>
      <button style="flex: 1; height: 46px; border: 1.5px solid #1E1B16; background: #FBF8F1; color: #1E1B16; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; cursor: pointer">[ ] DECEPTIVE</button>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; gap: 8px">
    <button style="flex: 1; height: 56px; border: 1.5px solid #1E1B16; background: transparent; color: #1E1B16; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; cursor: pointer">END TURN</button>
    <button style="flex: 2; height: 56px; border: none; background: #1E1B16; color: #F2EDE1; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer">NEXT QUESTION →</button>
  </div>
  <span style="font-size: 11px; text-align: center; color: #5E574A">Not admissible anywhere. Reads stress, not truth.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
