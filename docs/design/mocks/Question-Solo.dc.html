<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solo mode: the host asks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&amp;family=Work+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A160C}a:hover{color:#5A3420}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 18px 28px; background: #F2B33D; color: #2A160C; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="background: #2A160C; color: #F2B33D; border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: 14px">Solo · Sam vs. the host</span>
    <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 16px">Q 2 / 5</span>
  </div>

  <div style="display: flex; align-items: center; gap: 10px">
    <div style="width: 48px; height: 48px; border-radius: 24px; background: #2A160C; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2B33D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
    </div>
    <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 18px 18px 18px 4px; padding: 10px 14px">
      <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 20px">Here's one for you, Sam…</span>
    </div>
  </div>

  <div style="background: #D9412B; border: 3px solid #2A160C; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 0 #2A160C">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="background: #FFF4DF; border-radius: 12px; padding: 4px 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em">FROM THE SPICY DECK</span>
      <div style="display: flex; align-items: center; gap: 3px; height: 20px" aria-hidden="true">
        <sc-for list="{{levels}}" as="l" hint-placeholder-count="8">
          <span style="width: 4px; border-radius: 2px; background: #FFF4DF; height: {{l.h}}"></span>
        </sc-for>
      </div>
    </div>
    <p style="margin: 0; font-family: 'Bowlby One SC', sans-serif; font-size: 28px; line-height: 1.15; color: #FFF4DF">Have you ever pretended to love a gift?</p>
  </div>

  <div style="position: relative; height: 230px; border-radius: 24px; border: 3px solid #2A160C; background: #2A160C; overflow: hidden; display: flex; align-items: center; justify-content: center">
    <svg width="140" height="186" viewBox="0 0 190 250" fill="none" role="img" aria-label="Front camera on Sam with face guide"><ellipse cx="95" cy="125" rx="88" ry="118" stroke="#FFE9A8" stroke-width="4" stroke-dasharray="12 10"></ellipse></svg>
    <span style="position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 6px; background: #FFF4DF; border-radius: 14px; padding: 5px 10px; font-size: 12px; font-weight: 700"><span style="width: 9px; height: 9px; border-radius: 5px; background: #D9412B"></span>Measuring Sam</span>
    <span style="position: absolute; bottom: 12px; right: 12px; display: flex; align-items: center; gap: 6px; background: #FFF4DF; border-radius: 14px; padding: 5px 10px; font-size: 13px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 22 22" fill="none" stroke="#D9412B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 11h4l2-5 3 10 2-5h7"></path></svg>86 BPM</span>
  </div>

  <p style="margin: 0; text-align: center; font-size: 15px; font-weight: 700">Answer out loud when you're ready.</p>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; gap: 10px">
    <button aria-label="Pause the game" style="width: 56px; height: 48px; border-radius: 14px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #2A160C; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="3.5" height="12" rx="1"></rect><rect x="10.5" y="3" width="3.5" height="12" rx="1"></rect></svg></button>
    <button style="flex-grow: 1; height: 48px; border-radius: 14px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 3px 0 #2A160C; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h3l7 8h4M2 13h3l2-2.3M12 5h4M14 3l2 2-2 2M14 11l2 2-2 2"></path></svg>Different question</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var hs = [8, 14, 20, 11, 17, 9, 15, 6];
    return { levels: hs.map(function (h) { return { h: h + 'px' }; }) };
  }
}
</script>
</body>
</html>
