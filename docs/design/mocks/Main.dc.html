<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sus-o-meter lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&amp;family=Work+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A160C}a:hover{color:#5A3420}
input::placeholder{color:#6B4A33}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 54px 18px 28px; background: #F2B33D; color: #2A160C; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px">
  <a href="Settings.dc.html" aria-label="Settings" style="position: absolute; top: 4px; right: 18px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></a>
  <div style="background: #D9412B; border: 3px solid #2A160C; border-radius: 24px; padding: 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 6px 0 #2A160C">
    <div style="display: flex; justify-content: space-between; width: 100%" aria-hidden="true">
      <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="12">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #FFE9A8; border: 2px solid #2A160C"></span>
      </sc-for>
    </div>
    <h1 style="margin: 0; font-family: 'Bowlby One SC', sans-serif; font-weight: 400; font-size: 40px; line-height: 1; color: #FFF4DF">Sus-o-meter</h1>
    <div style="display: flex; justify-content: space-between; width: 100%" aria-hidden="true">
      <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="12">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #FFE9A8; border: 2px solid #2A160C"></span>
      </sc-for>
    </div>
  </div>
  <p style="margin: 0; text-align: center; font-size: 16px; font-weight: 600">The party game that reads your pulse. Not your mind.</p>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 22px">Contestants</span>
    <div role="group" aria-label="Game mode" style="display: flex; border: 2.5px solid #2A160C; border-radius: 22px; overflow: hidden; background: #FFF4DF">
      <button aria-pressed="true" style="height: 44px; padding: 0 16px; border: none; background: #2A160C; color: #F2B33D; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Party</button>
      <button aria-pressed="false" style="height: 44px; padding: 0 16px; border: none; background: transparent; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Solo · host asks</button>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{players}}" as="p" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; background: #FFF4DF; border: 2.5px solid #2A160C; border-radius: 16px; padding: 6px 6px 6px 10px">
        <div style="width: 36px; height: 36px; border-radius: 18px; background: #1F6F78; color: #FFF4DF; border: 2px solid #2A160C; display: flex; align-items: center; justify-content: center; font-family: 'Bowlby One SC', sans-serif; font-size: 16px">{{p.initial}}</div>
        <span style="flex-grow: 1; font-size: 17px; font-weight: 700">{{p.name}}</span>
        <button aria-label="Remove player" style="width: 44px; height: 44px; border: none; background: transparent; color: #2A160C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14"></path></svg></button>
      </div>
    </sc-for>
    <div style="display: flex; gap: 8px">
      <label for="newPlayer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add a contestant</label>
      <input id="newPlayer" placeholder="Add a contestant" style="flex-grow: 1; height: 52px; box-sizing: border-box; border-radius: 16px; border: 2.5px dashed #2A160C; background: transparent; color: #2A160C; padding: 0 14px; font-size: 16px; font-weight: 600; font-family: 'Work Sans', sans-serif">
      <button aria-label="Add contestant" style="width: 52px; height: 52px; border-radius: 16px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #2A160C; cursor: pointer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12"></path></svg></button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 700">Questions per turn</span>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 46px; border-radius: 14px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Bowlby One SC', sans-serif; font-size: 18px; cursor: pointer">3</button>
      <button style="flex: 1; height: 46px; border-radius: 14px; border: 2.5px solid #2A160C; background: #2A160C; color: #F2B33D; font-family: 'Bowlby One SC', sans-serif; font-size: 18px; cursor: pointer">5</button>
      <button style="flex: 1; height: 46px; border-radius: 14px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Bowlby One SC', sans-serif; font-size: 18px; cursor: pointer">7</button>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="Consent.dc.html" style="height: 60px; border-radius: 16px; border: 3px solid #2A160C; background: #1F6F78; color: #FFF4DF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Bowlby One SC', sans-serif; font-size: 22px; box-shadow: 0 5px 0 #2A160C">Start the show</a>
    <p style="margin: 0; text-align: center; font-size: 13px; font-weight: 600">For fun only. Measures stress reactions, not truth.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var names = ['Sam', 'Alex', 'Priya', 'Jordan'];
    var bulbs = [];
    for (var j = 0; j < 12; j++) { bulbs.push({ id: j }); }
    return { bulbs: bulbs, players: names.map(function (n) { return { name: n, initial: n.charAt(0) }; }) };
  }
}
</script>
</body>
</html>
