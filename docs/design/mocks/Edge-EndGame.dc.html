<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>End the show early</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&amp;family=Work+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A160C}a:hover{color:#5A3420}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 54px 18px 28px; background: #F2B33D; color: #2A160C; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between" aria-hidden="true">
    <span style="background: #2A160C; color: #F2B33D; border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: 14px">Alex's in the hot seat</span>
    <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 16px">Q 3 / 5</span>
  </div>
  <div style="height: 150px; border-radius: 20px; border: 3px solid #2A160C; background: #FFF4DF" aria-hidden="true"></div>
  <div style="height: 250px; border-radius: 24px; border: 3px solid #2A160C; background: #2A160C" aria-hidden="true"></div>

  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(42, 22, 12, 0.72); display: flex; align-items: flex-end; padding: 18px; box-sizing: border-box">
    <div role="dialog" aria-label="End the show?" style="width: 100%; background: #FFF4DF; border: 3px solid #2A160C; border-radius: 26px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #2A160C">
      <h2 style="margin: 0; font-family: 'Bowlby One SC', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.05">End the show?</h2>
      <p style="margin: 0; font-size: 15px; font-weight: 500; line-height: 1.45">We'll crown the winners from the questions played so far. Then everything is wiped: scores, transcripts, all of it.</p>
      <div style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 600">
        <span>Played: Sam (5), Alex (2)</span>
        <span>Not played yet: Priya, Jordan</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <button style="height: 56px; border-radius: 16px; border: 3px solid #2A160C; background: #2A160C; color: #F2B33D; font-family: 'Bowlby One SC', sans-serif; font-size: 19px; cursor: pointer">End and see scores</button>
        <button style="height: 52px; border-radius: 16px; border: 3px solid #2A160C; background: #1F6F78; color: #FFF4DF; font-family: 'Work Sans', sans-serif; font-size: 16px; font-weight: 700; box-shadow: 0 4px 0 #2A160C; cursor: pointer">Keep playing</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
