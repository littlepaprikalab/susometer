<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings and Presage API key</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&amp;family=Work+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A160C}a:hover{color:#5A3420}
input::placeholder{color:#6B4A33}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 18px 24px; background: #F2B33D; color: #2A160C; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back to lobby" style="width: 44px; height: 44px; border-radius: 22px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; display: flex; align-items: center; justify-content: center; box-sizing: border-box; box-shadow: 0 3px 0 #2A160C"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Bowlby One SC', sans-serif; font-weight: 400; font-size: 32px">Settings</h1>
  </div>

  <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 0 #2A160C">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <label for="apiKey" style="font-family: 'Bowlby One SC', sans-serif; font-size: 17px">Presage API key</label>
      <span style="display: flex; align-items: center; gap: 6px; border: 2px solid #2A160C; border-radius: 12px; padding: 3px 9px; font-size: 12px; font-weight: 700"><span style="width: 9px; height: 9px; border-radius: 5px; background: {{dot}}"></span>{{chip}}</span>
    </div>
    <div style="display: flex; gap: 8px">
      <input id="apiKey" type="password" value="{{keyValue}}" placeholder="Paste your key here" autocomplete="off" style="flex-grow: 1; min-width: 0; height: 48px; box-sizing: border-box; border-radius: 12px; border: 2.5px solid #2A160C; background: #FFFFFF; color: #2A160C; padding: 0 12px; font-size: 16px; font-family: ui-monospace, Menlo, monospace">
      <button aria-label="Show key" style="width: 48px; height: 48px; border-radius: 12px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 11s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"></path><circle cx="11" cy="11" r="2.5"></circle></svg></button>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 44px; border-radius: 12px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Paste</button>
      <button style="flex: 1; height: 44px; border-radius: 12px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Remove</button>
      <button style="flex: 1.4; height: 44px; border-radius: 12px; border: 2.5px solid #2A160C; background: #1F6F78; color: #FFF4DF; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 700; box-shadow: 0 3px 0 #2A160C; cursor: pointer">Test connection</button>
    </div>
    <span style="font-size: 13px; font-weight: 500; line-height: 1.4">{{helper}} Saved in this iPhone's Keychain, used only to sign in to Presage. Get one at <a href="https://physiology.presagetech.com" style="font-weight: 700">physiology.presagetech.com</a>.</span>
  </div>

  <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 20px; padding: 4px 14px; display: flex; flex-direction: column">
    <sc-for list="{{toggles}}" as="t" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: {{t.rule}}">
        <div style="flex-grow: 1; display: flex; flex-direction: column">
          <span style="font-size: 15px; font-weight: 700">{{t.label}}</span>
          <span style="font-size: 12px; font-weight: 500">{{t.sub}}</span>
        </div>
        <button role="switch" aria-checked="{{t.checked}}" aria-label="{{t.label}}" style="width: 54px; height: 32px; box-sizing: border-box; border-radius: 16px; border: 2.5px solid #2A160C; background: {{t.bg}}; padding: 2px; display: flex; justify-content: {{t.justify}}; cursor: pointer; flex-shrink: 0"><span style="width: 23px; height: 23px; border-radius: 12px; background: #FFF4DF; border: 2px solid #2A160C; box-sizing: border-box"></span></button>
      </div>
    </sc-for>
  </div>

  <button style="height: 50px; border-radius: 16px; border: 3px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 #2A160C; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h12M7 5V3h4v2M5 5l1 10h6l1-10"></path></svg>Wipe all game data now</button>

  <div style="flex-grow: 1"></div>
  <p style="margin: 0; text-align: center; font-size: 12px; font-weight: 600; line-height: 1.4">Sus-o-meter v0.1 · For fun only. Not a medical device. Not a lie detector.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"keyState":{"editor":"enum","options":["connected","missing","rejected"],"default":"connected"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.props.keyState ?? 'connected';
    var chip = s === 'connected' ? 'Connected' : (s === 'missing' ? 'No key yet' : 'Key rejected');
    var dot = s === 'connected' ? '#1F6F78' : '#D9412B';
    var helper = s === 'connected' ? 'Checked just now.' : (s === 'missing' ? 'The show can’t start without a key.' : 'Presage said AUTH_FAILED. Check for typos or make a new key.');
    var keyValue = s === 'missing' ? '' : 'pk_live_0000000000000000';
    var rows = [
      { label: 'Host voice', sub: 'The host speaks prompts out loud', on: true },
      { label: 'Sound effects', sub: 'Drumroll, buzzer, ding', on: true },
      { label: 'Haptics', sub: 'Never while measuring', on: true },
      { label: 'SDK telemetry', sub: 'Anonymous diagnostics to Presage', on: false },
      { label: 'Proof panel', sub: 'Show raw SmartSpectra values', on: false }
    ];
    return {
      chip: chip, dot: dot, helper: helper, keyValue: keyValue,
      toggles: rows.map(function (r, i) {
        return {
          label: r.label, sub: r.sub,
          checked: r.on ? 'true' : 'false',
          bg: r.on ? '#1F6F78' : '#E8D9BC',
          justify: r.on ? 'flex-end' : 'flex-start',
          rule: i < rows.length - 1 ? '1.5px solid #2A160C' : 'none'
        };
      })
    };
  }
}
</script>
</body>
</html>
