<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Question verdict</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&amp;family=Work+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A160C}a:hover{color:#5A3420}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 18px 28px; background: #F2B33D; color: #2A160C; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 18px">Question 2</span>
    <span style="background: #2A160C; color: #F2B33D; border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: 14px">Sam's in the hot seat</span>
  </div>

  <div style="background: #FFF4DF; border: 3px solid #2A160C; border-radius: 18px; padding: 8px 14px; display: flex; flex-direction: column; gap: 2px">
    <p style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3">Q: “Have you ever re-gifted a present?”</p>
    <p style="margin: 0; font-size: 15px; font-weight: 500; font-style: italic; line-height: 1.3">Sam: “No way. Okay… maybe once.”</p>
  </div>

  <div style="background: {{board}}; border: 3px solid #2A160C; border-radius: 26px; padding: 12px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 6px 0 #2A160C">
    <div style="display: flex; justify-content: space-between; width: 100%" aria-hidden="true">
      <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="12">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #FFE9A8; border: 2px solid #2A160C"></span>
      </sc-for>
    </div>
    <span style="margin-top: 8px; background: #FFF4DF; color: #2A160C; border-radius: 12px; padding: 4px 12px; font-weight: 700; font-size: 13px; letter-spacing: 0.08em">THE SUS-O-METER SAYS</span>
    <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 96px; line-height: 1; color: #FFF4DF">{{score}}</span>
    <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 38px; line-height: 1; color: #FFF4DF">{{label}}</span>
    <div style="display: flex; justify-content: space-between; width: 100%; margin-top: 10px" aria-hidden="true">
      <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="12">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #FFE9A8; border: 2px solid #2A160C"></span>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; gap: 5px" role="img" aria-label="Applause meter: {{lit}} of 10 lit">
      <sc-for list="{{blocks}}" as="k" hint-placeholder-count="10">
        <span style="flex: 1; height: 30px; border-radius: 6px; border: 2.5px solid #2A160C; background: {{k.color}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 13px">
      <span>Cool as ice</span>
      <span>Caught red-handed</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="background: #FFF4DF; border: 2.5px solid #2A160C; border-radius: 14px; padding: 6px; display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 21px">+16</span>
      <span style="font-size: 12px; font-weight: 600">pulse</span>
    </div>
    <div style="background: #FFF4DF; border: 2.5px solid #2A160C; border-radius: 14px; padding: 6px; display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 21px">+41%</span>
      <span style="font-size: 12px; font-weight: 600">blinks</span>
    </div>
    <div style="background: #FFF4DF; border: 2.5px solid #2A160C; border-radius: 14px; padding: 6px; display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Bowlby One SC', sans-serif; font-size: 21px">2.1s</span>
      <span style="font-size: 12px; font-weight: 600">pause</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 700; text-align: center">Does the room agree?</span>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 46px; border-radius: 14px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><span style="width: 12px; height: 12px; border-radius: 6px; background: #1F6F78"></span>Legit</button>
      <button style="flex: 1; height: 46px; border-radius: 14px; border: 2.5px solid #2A160C; background: #FFF4DF; color: #2A160C; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><span style="width: 12px; height: 12px; border-radius: 6px; background: #D9412B"></span>Total sus</button>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; gap: 10px">
    <a href="Leaderboard.dc.html" style="flex: 1; height: 58px; border-radius: 16px; border: 3px solid #2A160C; background: #FFF4DF; color: #2A160C; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; box-shadow: 0 5px 0 #2A160C">End turn</a>
    <a href="Question.dc.html" style="flex: 2; height: 58px; border-radius: 16px; border: 3px solid #2A160C; background: #1F6F78; color: #FFF4DF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Bowlby One SC', sans-serif; font-size: 19px; box-shadow: 0 5px 0 #2A160C">Next question</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"score":{"editor":"range","default":82,"min":0,"max":100,"step":1},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var score = this.props.score ?? 82;
    var ramp = ['#1F6F78', '#1F6F78', '#3E8C7A', '#8FAE5B', '#E7C64A', '#FFE9A8', '#F08A4B', '#E5683A', '#D9412B', '#B8301D'];
    var lit = Math.round(score / 10);
    var blocks = [];
    for (var i = 0; i < 10; i++) { blocks.push({ color: i < lit ? ramp[i] : '#E8D9BC' }); }
    var bulbs = [];
    for (var j = 0; j < 12; j++) { bulbs.push({ id: j }); }
    var label = score >= 60 ? 'Sus!' : (score < 35 ? 'Legit' : 'Hmm…');
    var board = score >= 60 ? '#D9412B' : (score < 35 ? '#1F6F78' : '#8A4B1C');
    return { score: score, label: label, board: board, lit: lit, blocks: blocks, bulbs: bulbs };
  }
}
</script>
</body>
</html>
