name: susometer
description: "Sus-o-meter: a camera-and-voice party game powered by Presage SmartSpectra."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/decks/
    - assets/sfx/

  fonts:
    - family: BowlbyOneSC
      fonts:
        - asset: assets/fonts/BowlbyOneSC-Regular.ttf
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
